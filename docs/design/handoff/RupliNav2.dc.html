<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1.5px solid var(--line);height:76px;padding:0 6px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<sc-if value="{{ t.on }}"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)">
<span style="width:60px;height:32px;border-radius:16px;background:var(--yellow);color:#14211B;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg></span>
<span style="font-size:13px;font-weight:700">{{ t.label }}</span>
</div></sc-if>
<sc-if value="{{ t.off }}"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);cursor:pointer" style-hover="color:var(--ink)">
<span style="width:60px;height:32px;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg></span>
<span style="font-size:13px;font-weight:500">{{ t.label }}</span>
</div></sc-if>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:76},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;lists&quot;,&quot;compare&quot;,&quot;spend&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'lists'|'compare'|'spend'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const tabs = [
      ['home', 'Home', 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
      ['lists', 'Lists', 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01'],
      ['compare', 'Compare', 'M12 3v18M7 21h10M4 7h16M6 7l-3 8c1.5 1.3 4.5 1.3 6 0zM18 7l-3 8c1.5 1.3 4.5 1.3 6 0z'],
      ['spend', 'Spend', 'M21 12A9 9 0 1 1 12 3v9zM15 3.5A9 9 0 0 1 20.5 9H15z']
    ].map(([k, label, d]) => ({ label, d, on: k === a, off: k !== a }));
    return { tabs };
  }
}
</script>
</body>
</html>
